<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="public/logo.svg">
<link rel="stylesheet" href="styles.css">
<title>MAGHRABY STORE • Pro</title>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div class="brand"><img src="public/logo.svg"><div><b>MAGHRABY</b><span>STORE</span><small>PRO MANAGER</small></div></div>
  <div class="clock"><span id="date"></span><strong id="time"></strong></div>
  <div id="nav"></div>
  <div class="side-foot">
    <button data-page="settings">⚙ الإعدادات</button>
    <button id="backup">⇩ نسخة احتياطية</button>
  </div>
</aside>
<main>
<header>
  <button id="menu" class="icon-btn">☰</button>
  <div><h1 id="title">لوحة التحكم</h1><span id="saveState">● محفوظ على الجهاز</span></div>
  <div class="header-actions">
    <button class="primary" data-page="sale">+ بيع</button>
    <button class="mint" data-page="repair">+ استلام صيانة</button>
    <button class="dark" id="closeToday">إقفال اليوم</button>
  </div>
</header>
<section id="view"></section>
</main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-title"><h2 id="mt"></h2><button id="mc">×</button></div><div id="mb"></div></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
